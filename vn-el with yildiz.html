<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TRANSLATE WITH ME 🚀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #1a73e8; }
        .translator-box {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }
        textarea {
            width: 48%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
        }
        button {
            background-color: rgb(74, 161, 236);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #1a73e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .lang-select {
            margin-bottom: 10px;
            font-size: 16px;
        }
        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌐 TRANSLATE WITH ME 🚀</h1>
        
        <div class="lang-select">
            Chiều dịch: 
            <select id="langPair">
                <option value="en|vi">Tiếng Anh ➡️ Tiếng Việt</option>
                <option value="vi|en">Tiếng Việt ➡️ Tiếng Anh</option>
            </select>
        </div>
        
        <div class="translator-box">
            <textarea id="inputText" placeholder="Nhập bất kỳ từ hoặc câu nào..."></textarea>
            <textarea id="outputText" placeholder="AI đang dịch tự động..." readonly></textarea>
        </div>

        <button onclick="aiTranslate()">Dịch tự động bằng AI</button>
    </div>

    <script>
        async function aiTranslate() {
            let text = document.getElementById("inputText").value.trim();
            let outputField = document.getElementById("outputText");
            let langPair = document.getElementById("langPair").value;

            if (text === "") {
                outputField.value = "Vui lòng nhập nội dung cần dịch!";
                return;
            }

            outputField.value = "Đang dịch...";

            // Gọi API dịch tự động công khai (hoạt động giống Google Dịch)
            let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;

            try {
                let response = await fetch(url);
                let data = await response.json();
                
                if (data && data.responseData) {
                    outputField.value = data.responseData.translatedText;
                } else {
                    outputField.value = "Không thể dịch được nội dung này.";
                }
            } catch (error) {
                outputField.value = "Lỗi kết nối tới hệ thống dịch!";
            }
        }
    </script>

</body>
