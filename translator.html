<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TRANSLATE WITH ME🚀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #1a73e8; }
        .translator-box, .add-box {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }
        textarea, input {
            width: 48%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        textarea {
            height: 100px;
            resize: none;
        }
        input {
            height: 20px;
        }
        button {
            background-color: rgb(74, 161, 236);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #1a73e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .section-title {
            margin-top: 30px;
            font-size: 18px;
            color: #333;
            text-align: left;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌐 TRANSLATE WITH ME🚀</h1>
        <p>Help you learn vocabulary (EN-VI):</p>
        
        <div class="translator-box">
            <textarea id="inputText" placeholder="Nhập từ cần dịch..."></textarea>
            <textarea id="outputText" placeholder="Kết quả dịch..." readonly></textarea>
        </div>

        <button onclick="translateWord()">Dịch ngay</button>

        <div class="section-title">✨ Dạy thêm từ mới cho từ điển:</div>
        <div class="add-box">
            <input type="text" id="newEng" placeholder="Nhập từ tiếng Anh...">
            <input type="text" id="newVie" placeholder="Nhập nghĩa tiếng Việt...">
        </div>
        <button onclick="addNewWord()">Thêm vào từ điển</button>
        <div id="message"></div>
    </div>

    <script>
        // Kho từ điển ban đầu
        let dictionary = {
            "hello": "Xin chào",
            "xin chào": "Hello",
            "cat": "Con mèo",
            "con mèo": "Cat",
            "diplomat": "Nhà ngoại giao",
            "nhà ngoại giao": "Diplomat",
            "environment": "Môi trường",
            "môi trường": "Environment",
            "future": "Tương lai",
            "tương lai": "Future",
            "refugee": "Người tị nạn",
            "người tị nạn": "Refugee"
        };

        function translateWord() {
            let word = document.getElementById("inputText").value.trim().toLowerCase();
            let outputField = document.getElementById("outputText");

            if (word === "") {
                outputField.value = "Vui lòng nhập từ cần dịch!";
                return;
            }

            if (dictionary[word]) {
                outputField.value = dictionary[word];
            } else {
                outputField.value = "Xin lỗi, từ này chưa có trong từ điển mini!";
            }
        }

        function addNewWord() {
            let eng = document.getElementById("newEng").value.trim().toLowerCase();
            let vie = document.getElementById("newVie").value.trim();
            let msg = document.getElementById("message");

            if (eng === "" || vie === "") {
                msg.style.color = "red";
                msg.innerText = "Vui lòng nhập đầy đủ cả từ Anh và nghĩa Việt!";
                return;
            }
            dictionary[eng] = vie;
            dictionary[vie.toLowerCase()] = eng;

            msg.style.color = "#28a745";
            msg.innerText = `Đã dạy thành công từ: "${eng}" -> "${vie}"!`;
            document.getElementById("newEng").value = "";
            document.getElementById("newVie").value = "";
        }
    </script>

</body>
</html>
